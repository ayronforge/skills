<meta charset="utf-8">
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  --bg: oklch(0.985 0.003 250);
  --raised: oklch(0.96 0.005 250);
  --card: oklch(1 0 0);
  --fg: oklch(0.2 0.01 250);
  --muted: oklch(0.45 0.012 250);
  --faint: oklch(0.58 0.012 250);
  --border: oklch(0.9 0.006 250);
  --before: oklch(0.52 0.15 35);
  --before-wash: oklch(0.95 0.03 35);
  --after: oklch(0.48 0.14 250);
  --after-wash: oklch(0.95 0.025 250);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.17 0.008 250); --raised: oklch(0.21 0.009 250); --card: oklch(0.23 0.01 250);
    --fg: oklch(0.96 0.004 250); --muted: oklch(0.76 0.01 250); --faint: oklch(0.62 0.012 250);
    --border: oklch(0.31 0.01 250); --before: oklch(0.76 0.13 40); --before-wash: oklch(0.28 0.05 40);
    --after: oklch(0.78 0.11 250); --after-wash: oklch(0.28 0.05 250); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.17 0.008 250); --raised: oklch(0.21 0.009 250); --card: oklch(0.23 0.01 250);
  --fg: oklch(0.96 0.004 250); --muted: oklch(0.76 0.01 250); --faint: oklch(0.62 0.012 250);
  --border: oklch(0.31 0.01 250); --before: oklch(0.76 0.13 40); --before-wash: oklch(0.28 0.05 40);
  --after: oklch(0.78 0.11 250); --after-wash: oklch(0.28 0.05 250); color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 400 15px/1.6 var(--font); }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 56px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.intro { max-width: 68ch; display: grid; gap: 12px; }
h1 { margin: 0; font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.1; font-weight: 750; letter-spacing: -0.03em; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); text-wrap: pretty; }
nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
nav a { display: inline-flex; gap: 8px; align-items: center; padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px;
  color: var(--fg); text-decoration: none; font-weight: 600; font-size: 14px; }
nav a:hover, nav a:focus-visible { border-color: var(--fg); outline: none; }
nav a span { color: var(--faint); font-variant-numeric: tabular-nums; }
.note { margin: 20px 0 0; padding: 12px 16px; border-radius: 12px; background: var(--raised); color: var(--muted); font-size: 14px; max-width: 80ch; }
.group { margin-top: 64px; display: grid; gap: 44px; }
h2 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 10px;
  padding-bottom: 12px; border-bottom: 1px solid var(--border); }
h2 .count { font-size: 15px; font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; }
.pair { display: grid; gap: 14px; scroll-margin-top: 24px; }
.pair header { display: grid; gap: 4px; max-width: 80ch; }
h3 { margin: 0; font-size: 1.08rem; font-weight: 700; letter-spacing: -0.01em; }
.pair header p { margin: 0; color: var(--muted); }
.pair-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 760px) { .pair-grid { grid-template-columns: minmax(0, 1fr); } }
.shot { margin: 0; min-width: 0; display: grid; gap: 8px; }
.shot a { display: block; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
.shot a:focus-visible { outline: 3px solid var(--after); outline-offset: 2px; }
.shot img { display: block; width: 100%; height: auto; max-width: 100%; }
.tag { display: inline-flex; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.tag-antes { background: var(--before-wash); color: var(--before); }
.tag-depois { background: var(--after-wash); color: var(--after); }
</style>
<main class="wrap">
  <div class="intro">
    <h1>{{TITLE}}</h1>
    <p>{{INTRO}}</p>
  </div>
  {{NAV}}
  {{MISSING}}
  {{SECTIONS}}
</main>
